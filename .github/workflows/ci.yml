name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Database (release asset, verified)
        run: |
          mkdir -p db
          curl -fsSL https://github.com/sagaciouszu/destiny-agent-grimoire/releases/latest/download/grimoire.db -o db/grimoire.db
          curl -fsSL https://github.com/sagaciouszu/destiny-agent-grimoire/releases/latest/download/SHA256SUMS -o /tmp/SHA256SUMS
          grep '  grimoire\.db$' /tmp/SHA256SUMS > /tmp/SHA256SUMS.db
          cd db && sha256sum -c /tmp/SHA256SUMS.db

      - name: Migrate smoke (source builds; enrichments need local-only dumps)
        run: GRIMOIRE_DB="$RUNNER_TEMP/grimoire-smoke.db" python3 db/migrate.py

      - name: Conformance
        run: python3 tests/conformance.py

      - name: Database checks
        run: bash tests/test-db.sh

      - name: Query interface
        run: bash tests/query-interface-test.sh

      - name: Robustness and injection
        run: python3 tests/robustness-test.py

      - name: Agent layout
        run: bash tests/agent-layout-test.sh

      - name: Agent suite manifests
        run: python3 tests/suite-manifest-test.py

      - name: Retrieval evaluation
        run: python3 tests/retrieval-eval.py

      - name: Documentation audit
        run: python3 tests/docs-audit.py

      - name: Item audit
        run: python3 tests/item-audit.py

      - name: MCP dependencies
        run: |
          python3 -m venv mcp-server/.venv
          mcp-server/.venv/bin/pip install --require-hashes -r mcp-server/requirements.lock.txt

      - name: MCP contract
        run: mcp-server/.venv/bin/python tests/mcp-test.py

      - name: MCP matrix
        run: mcp-server/.venv/bin/python tests/mcp-matrix-test.py

  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Database (release asset, verified)
        shell: bash
        run: |
          mkdir -p db
          curl -fsSL https://github.com/sagaciouszu/destiny-agent-grimoire/releases/latest/download/grimoire.db -o db/grimoire.db
          curl -fsSL https://github.com/sagaciouszu/destiny-agent-grimoire/releases/latest/download/SHA256SUMS -o SHA256SUMS
          grep '  grimoire\.db$' SHA256SUMS > SHA256SUMS.db
          cd db && sha256sum -c ../SHA256SUMS.db

      - name: Migrate smoke (source builds)
        shell: bash
        run: GRIMOIRE_DB="$RUNNER_TEMP/grimoire-smoke.db" python db/migrate.py

      - name: MCP install (Git Bash)
        shell: bash
        run: bash mcp-server/install.sh

      - name: MCP probe (cmd launcher)
        run: python mcp-server/probe.py --launcher cmd

      - name: MCP probe (PowerShell launcher)
        run: python mcp-server/probe.py --launcher ps1

      - name: MCP contract
        run: mcp-server\.venv\Scripts\python.exe tests/mcp-test.py

      - name: Tree mirror (rsync replacement)
        run: python tests/mirror-tree-test.py

      - name: Checkout agent for link test
        uses: actions/checkout@v7
        with:
          repository: sagaciouszu/destiny-agent-ghost
          path: ghost

      - name: Agent setup links lore (symlink -> junction -> clone)
        shell: bash
        run: cd ghost && bash setup.sh "$GITHUB_WORKSPACE"

      - name: Query through linked lore
        shell: bash
        run: python ghost/lore/db/query.py stats
