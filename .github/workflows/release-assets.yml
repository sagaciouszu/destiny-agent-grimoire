name: Release assets

# Keep the static database endpoints truthful:
#   grimoire.db      - the published artifact (operator upload)
#   grimoire.db.xz   - smallest (29 MiB, xz -9e); Linux/macOS/Termux/7-Zip
#   grimoire.db.gz   - universal (56 MiB); Android apps via GZIPInputStream
#   SHA256SUMS       - digests for all three
#
# Triggers: on publish (immediate), on dispatch (backfill a tag, defaults to
# the latest release), and a daily sweep that downloads the published bytes,
# verifies the compressed assets decompress to them, and repairs (recompress +
# re-upload) whenever they are missing or stale - e.g. after grimoire.db was
# re-uploaded to an existing release. Compression is byte-reproducible
# (xz deterministic, gzip -n), so repairs never churn digests.

on:
  release:
    types: [published]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to check (defaults to the latest release)
        required: false

permissions:
  contents: write

jobs:
  compress-database:
    runs-on: ubuntu-26.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name || '' }}
    steps:
      - name: Resolve tag and download the published database
        run: |
          TAG="${TAG:-$(gh release view --json tagName -q .tagName)}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          for attempt in 1 2 3 4 5; do
            if gh release download "$TAG" --pattern grimoire.db --clobber; then
              break
            fi
            [ "$attempt" = 5 ] && { echo "grimoire.db not on release $TAG"; exit 1; }
            echo "assets not ready (attempt $attempt); retrying in 6s"
            sleep 6
          done

      - name: Check existing archives against the published bytes
        id: check
        run: |
          LOCAL=$(sha256sum grimoire.db | awk '{print $1}')
          CONSISTENT=false
          if gh release download "$TAG" --pattern SHA256SUMS --clobber \
              && grep -qE "  grimoire\.db$" SHA256SUMS; then
            PUBLISHED=$(grep -E '  grimoire\.db$' SHA256SUMS | awk '{print $1}')
            if [ "$LOCAL" = "$PUBLISHED" ] \
                && gh release download "$TAG" --pattern grimoire.db.xz --pattern grimoire.db.gz --clobber; then
              if xz -dc grimoire.db.xz | cmp - grimoire.db \
                  && gzip -dc grimoire.db.gz | cmp - grimoire.db; then
                CONSISTENT=true
              fi
            fi
          fi
          echo "consistent=$CONSISTENT" >> "$GITHUB_OUTPUT"
          echo "archives consistent: $CONSISTENT"

      - name: Compress (xz -9e, gzip -9 -n)
        if: steps.check.outputs.consistent != 'true'
        run: |
          xz -9e -T0 -c grimoire.db > grimoire.db.xz
          gzip -9 -n -c grimoire.db > grimoire.db.gz

      - name: Round-trip verify
        if: steps.check.outputs.consistent != 'true'
        run: |
          xz -t grimoire.db.xz
          gzip -t grimoire.db.gz
          xz -dc grimoire.db.xz > roundtrip.db
          cmp grimoire.db roundtrip.db
          sqlite3 roundtrip.db 'PRAGMA integrity_check;' | grep -qx ok
          gzip -dc grimoire.db.gz > roundtrip.db
          cmp grimoire.db roundtrip.db
          rm -f roundtrip.db

      - name: Refresh SHA256SUMS
        if: steps.check.outputs.consistent != 'true'
        run: |
          if [ -f SHA256SUMS ]; then
            # grep exits 1 when every line is filtered (single-file sums); that
            # is the expected path under bash -e, so tolerate it.
            grep -vE ' grimoire\.db(\.(xz|gz))?$' SHA256SUMS > SHA256SUMS.new || true
          else
            : > SHA256SUMS.new
          fi
          sha256sum grimoire.db grimoire.db.xz grimoire.db.gz >> SHA256SUMS.new
          sort -k2 SHA256SUMS.new > SHA256SUMS
          rm -f SHA256SUMS.new
          cat SHA256SUMS

      - name: Upload compressed assets
        if: steps.check.outputs.consistent != 'true'
        run: gh release upload "$TAG" grimoire.db.xz grimoire.db.gz SHA256SUMS --clobber
